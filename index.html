<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Brawlkai</title>
    <meta name="description" content="Brawlkai: a chaotic pixel-art anime brawler for up to 10 fighters. Local multiplayer + bots, in your browser." />
    <meta name="theme-color" content="#0b0912" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brawlkai" />
    <meta property="og:title" content="Brawlkai" />
    <meta property="og:description" content="Tiny fighters. Huge power. A pixel-art anime brawler for up to 10 fighters. Local multiplayer + bots, free in your browser." />
    <meta property="og:url" content="https://supa-figh.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Brawlkai" />
    <meta name="twitter:description" content="Tiny fighters. Huge power. A pixel-art anime brawler, free in your browser." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23140f1e'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%23ea4a4a'/%3E%3Crect x='2' y='1' width='4' height='1' fill='%23f8c840'/%3E%3Crect x='2' y='6' width='4' height='1' fill='%23f8c840'/%3E%3C/svg%3E"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0912;
        overflow: hidden;
        overscroll-behavior: none;
      }
      :root {
        --sl: env(safe-area-inset-left, 0px);
        --sr: env(safe-area-inset-right, 0px);
        --st: env(safe-area-inset-top, 0px);
        --sb: env(safe-area-inset-bottom, 0px);
      }
      /* phones: the 640x360 view is scaled to fill the screen (--fit is set from main.ts) */
      html.touch, html.touch body { position: fixed; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      html.touch #game canvas {
        width: calc(var(--fit) * 640px) !important;
        height: calc(var(--fit) * 360px) !important;
        max-width: none;
        max-height: none;
        image-rendering: auto;
        touch-action: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #0b0912;
        color: #f8c840;
        font: bold 18px monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
      }
      #rotate .phone { width: 34px; height: 60px; border: 3px solid #f8c840; border-radius: 6px; animation: turn 2s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) { html.touch #rotate { display: flex; } }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #crash {
        position: fixed;
        left: 8px;
        bottom: 8px;
        max-width: 60%;
        padding: 6px 10px;
        font: 12px monospace;
        color: #fff4a0;
        background: #3a0a14cc;
        border: 1px solid #ea4a4a;
        display: none;
        white-space: pre-wrap;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100%;
        max-height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="crash"></div>
    <div id="rotate"><div class="phone"></div>TURN YOUR PHONE SIDEWAYS</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
